[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthquakes"
version = "1.0.0"
description = "CLI and training pipeline for earthquake catalog data (USGS, graph link prediction, LSTM)"
readme = "earthquakes/README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "python-dotenv",
    "pyyaml",
    "pydantic",
    "pandas",
    "numpy",
    "scipy>=1.10,<2",
    "geopy",
    "geopandas",
    "geoplot",
    "scikit-learn",
    "torch",
    "torchmetrics",
    "networkx",
    "node2vec",
    "gensim",
    "ray[tune]",
    "matplotlib",
    "seaborn",
    "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["earthquakes/tests"]
pythonpath = ["earthquakes"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "uv.lock", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[project.scripts]
quakes = "main:main"

[tool.hatch.build.targets.wheel]
sources = ["earthquakes"]
exclude = ["earthquakes/tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
